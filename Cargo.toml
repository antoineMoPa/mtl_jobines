[package]
name = "mtl_jobines"
version = "0.1.0"
edition = "2021"
license = "MIT"
default-run = "mtl_jobines"
build = false

[workspace]
members = ["opencity", "crates/mtl_world"]
default-members = [".", "crates/mtl_world"]
resolver = "2"

[lib]
# Native variants need hashed rlib filenames to coexist in Cargo's shared cache.
# The web build explicitly requests cdylib output with cargo rustc.
crate-type = ["rlib"]

[[example]]
name = "procedural_residency"
required-features = ["memory-profile"]

[[example]]
name = "building_memory"
required-features = ["memory-profile"]

[features]
# Diagnostic counters only; default builds keep the standard allocator.
memory-profile = ["mtl_world/memory-profile", "opencity/memory-profile"]

[dependencies]
mtl_world = { path = "crates/mtl_world" }
earcutr = "0.5"
egui = "0.36"
egui_command_palette = { path = "opencity/crates/egui_command_palette" }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "extras"] }
resvg = { version = "0.45.1", default-features = false, features = ["raster-images"] }
opencity = { path = "opencity", default-features = false, features = ["render-materials", "expansion-ui", "external-web-assets"] }
wgpu = "30.0.1"
winit = "0.30"
glam = "0.29"
pollster = "0.4"
png = "0.17"
bytemuck = { version = "1", features = ["derive"] }
web-time = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = { version = "0.36", default-features = false }
rfd = "0.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", features = ["webgl"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "HtmlCanvasElement", "HtmlElement", "Element", "Storage", "console", "MediaQueryList", "AudioContextState", "AudioBuffer", "AudioBufferSourceNode", "AudioNode", "AudioDestinationNode"] }

[dev-dependencies]
mtl_world = { path = "crates/mtl_world", features = ["test-support"] }
naga = { version = "30", features = ["wgsl-in"] }

# Map geometry and SVG rasterization also need optimization during development.
# Keep debug assertions and symbols while avoiding minute-long native startup.
[profile.dev]
opt-level = 1
incremental = true

# Moon launches use this incremental profile instead of reoptimizing the whole
# application at release level after every edit.
[profile.dev.package.mtl_jobines]
debug = 1

# Keep simulation and geometry fast even in the local incremental game build.
[profile.dev.package.mtl_world]
opt-level = 3
debug = 1

# Dependencies change rarely; omit their debug data to reduce compile/link work.
# Workspace code keeps its own debug symbols and optimized geometry paths.
[profile.dev.package."*"]
debug = 0

# Keep geometry optimized while reducing editor compile/link debug-data work.
[profile.dev.package.opencity]
opt-level = 3
debug = 1
