[package]
name = "mtl_jobines"
version = "0.1.0"
edition = "2021"
license = "MIT"
default-run = "mtl_jobines"

[workspace]
members = ["opencity"]
default-members = ["."]
resolver = "2"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
egui = "0.36"
egui_command_palette = { path = "opencity/crates/egui_command_palette" }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "extras"] }
resvg = { version = "0.45.1", default-features = false, features = ["raster-images"] }
opencity = { path = "opencity", default-features = false, features = ["render-materials", "expansion-ui", "external-web-assets"] }
wgpu = "30.0.1"
winit = "0.30"
glam = "0.29"
rapier3d = { version = "0.22", features = ["enhanced-determinism"] }
pollster = "0.4"
png = "0.17"
bytemuck = { version = "1", features = ["derive"] }
web-time = "1.1"
rodio = { version = "=0.13.1", default-features = false }
cpal = { version = "=0.15.3", features = ["wasm-bindgen"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ambisonic = "=0.4.1"
egui-winit = { version = "0.36", default-features = false }
rfd = "0.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "HtmlCanvasElement", "HtmlElement", "Element", "Storage", "console"] }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }

# Map geometry and SVG rasterization also need optimization during development.
# Keep debug assertions and symbols while avoiding minute-long native startup.
[profile.dev]
opt-level = 1

# Dependencies change rarely; omit their debug data to reduce compile/link work.
# Workspace code keeps its own debug symbols and optimized geometry paths.
[profile.dev.package."*"]
debug = 0

# Keep geometry optimized while reducing editor compile/link debug-data work.
[profile.dev.package.opencity]
debug = 1
