<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Groundwork · Surface atlas</title><link rel="stylesheet" href="surface-study/study.css"></head>
<body>
<header><div class="brand"><svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true"><path fill="#375741" d="M1 11 16 3l15 8-15 8z M1 16l4-2 11 6 11-6 4 2-15 8z M1 21l4-2 11 6 11-6 4 2-15 8z"/></svg>Groundwork</div><span class="header-tag">MTL JOBINES &nbsp; / &nbsp; ENVIRONMENT ART</span></header>
<main><div class="intro"><div><div class="eyebrow">MATERIAL STUDIES</div><h1>Surface atlas</h1></div><p>Explore how pavement, concrete and vegetation meet at ground level.</p></div>
<nav aria-label="Surface studies"><button data-site="street" aria-pressed="true">Street curb</button><button data-site="verge" aria-pressed="false">Roadside verge</button><button data-site="runway" aria-pressed="false">Landing strip</button></nav>
<div class="workspace"><section class="stage" aria-label="Interactive material sample"><canvas aria-label="Three-dimensional surface cross section"></canvas><div class="stage-label"><i></i> LIVE SPECIMEN</div><div class="camera"><button id="view" title="Switch camera angle">Top view</button><button id="reset" aria-label="Reset camera" title="Reset camera">↺</button></div><div id="error" hidden></div><span class="gesture">Drag to orbit &nbsp;·&nbsp; Scroll to zoom</span></section>
<aside><div class="eyebrow">SPECIMEN NOTES</div><h2 id="name"></h2><p id="notes"></p><div id="layers"></div><hr><div class="eyebrow">EDGE CONTROLS</div><label for="wear">Weathering <output id="amount">72%</output></label><input type="range" id="wear" min="0" max="100" value="72"><label for="clean" class="switch"><span>Clean-edge comparison</span><input type="checkbox" id="clean"></label></aside></div>
</main><script src="surface-study/three.min.js"></script><script src="surface-study/study.js"></script></body></html>
