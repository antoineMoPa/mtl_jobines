</style></head><body><main><header><small>MTL JOBINES</small><small>ENVIRONMENT ART / WATER</small></header>
<h1>Fleuve Saint-Laurent</h1><div class="view"><canvas aria-label="Moving river surface and bridge seen from the Montréal waterfront"></canvas><span id="error" hidden></span></div>
<footer><div class="controls"><label>Light <select id="light"><option value="0">Golden hour</option><option value="1">Midday</option><option value="2">Blue hour</option></select></label><button id="motion">Pause</button></div><small>Montréal · Québec</small></footer></main>
<script id="river" type="text/plain">#version 300 es
precision highp float;
precision highp int;
uniform vec2 viewport;
uniform float time;
uniform int light;
uniform highp sampler2D foamThreshold;
out vec4 pixel;
float hash(float x){return fract(sin(x*78.23)*4375.5);}
float noise(vec2 p){
    vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
    float k=i.x+i.y*137.;
    return mix(mix(hash(k),hash(k+1.),f.x),mix(hash(k+137.),hash(k+138.),f.x),f.y);
}
vec3 sky(vec3 ray,vec3 sun){
    vec3 zenith=light==0?vec3(.17,.34,.51):light==1?vec3(.11,.36,.67):vec3(.035,.058,.13);
    vec3 haze=light==0?vec3(.87,.68,.52):light==1?vec3(.67,.81,.88):vec3(.27,.28,.41);
    return mix(haze,zenith,smoothstep(0.,.65,ray.z))
        + vec3(1.,.57,.26)*pow(max(dot(sun,ray),0.),48.)*(light==2?.04:.36);
}
float river_hash(vec2 p){
    uvec2 q = uvec2(ivec2(p));
    uint h = q.x*374761393u + q.y*668265263u;
    h = (h ^ (h >> 13u))*1274126177u;
    return float(h ^ (h >> 16u))/4294967295.0;
}
// One simplex corner contributes height and its analytic XY derivative.
// The integer hash selects a gradient independently at each world-space corner.
vec3 river_corner(vec2 cell, vec2 d) {
    float angle = river_hash(cell) * 6.2831853;
    vec2 g = vec2(cos(angle), sin(angle));
    float w = max(0.5 - dot(d, d), 0.0);
    float w3 = w*w*w;
    float h = dot(g, d);
    return 70.0 * w3 * vec3(w*h, w*g - 8.0*h*d);
}

vec3 river_noise(vec2 p) {
    vec2 cell = floor(p + (p.x + p.y) * 0.3660254);
    vec2 a = p - cell + (cell.x + cell.y) * 0.21132487;
    vec2 corner = (a.x > a.y ? vec2(1.0, 0.0) : vec2(0.0, 1.0));
    return river_corner(cell, a)
        + river_corner(cell + corner, a - corner + 0.21132487)
        + river_corner(cell + 1.0, a - 0.57735027);
}

// Each octave has its own drift, orientation and crest length. Project its
// gradient back into world space and attenuate unresolved detail by pixel size.
vec3 river_octave(vec2 p, vec2 axis, float stretch, float frequency,
                vec2 drift, float strength, float footprint) {
    float weight = 1.0 - smoothstep(0.18, 0.85, footprint * frequency);
    if (weight <= 0.0) { return vec3(0.0); }
    vec2 along = vec2(-axis.y, axis.x) * stretch;
    vec2 uv = vec2(dot(p, axis), dot(p, along)) * frequency + drift;
    vec3 sampleWave = river_noise(uv);
    return weight * vec3(strength * (axis * sampleWave.y + along * sampleWave.z), sampleWave.x);
}

// The leading face of a raised, steep wind wave injects air in a short strip.
float breaker_front(vec3 wave, float swell) {
    float steep = -dot(wave.xy, vec2(0.28, 0.96));
    return smoothstep(0.08, 0.21, steep) * smoothstep(0.12, 0.49, wave.z + 0.22*swell);
}

vec3 river_surface(vec2 p, float t, float footprint) {
    // A slow current bends the shorter crests and varies capillary activity.
    vec3 current = river_noise(p * 0.041 + vec2(-0.017, 0.009)*t);
    vec2 bend = vec2(3.4, -2.1);
    vec2 q = p + bend * current.x;
    float wind = 0.72 + 0.45*current.x;
    vec3 swell = river_octave(p, vec2(0.60, 0.80), 0.52, 0.091,
        vec2(-0.077, 0.012)*t, 0.053, footprint);
    vec3 windWave = river_octave(q, vec2(0.28, 0.96), 0.31, 0.37,
        vec2(-0.24, 0.047)*t + vec2(37.0, 9.0), 0.069, footprint);
    vec3 chop = windWave + river_octave(q, vec2(-0.76, 0.65), 0.57, 0.83,
        vec2(-0.34, -0.11)*t + vec2(-13.0, 41.0), 0.045, footprint);
    vec3 ripples = river_octave(q, vec2(0.48, 0.88), 0.28, 2.7,
        vec2(-0.73, 0.17)*t + vec2(81.0, -7.0), 0.041, footprint)
        + river_octave(q, vec2(-0.32, 0.95), 0.48, 7.9,
        vec2(-1.13, -0.31)*t + vec2(12.0, 62.0), 0.027, footprint);
    vec2 detail = chop.xy + wind * ripples.xy;
    float front = breaker_front(windWave, swell.z);
    // Wind chop and swell supply the time-varying saturation. A wider crest
    // shoulder leaves room for the individual clumps to form and dissipate.
    float shoulder = smoothstep(0.08, 0.96, 0.58*chop.z + 0.40*swell.z);
    float saturation = clamp(0.54*shoulder + 0.24*front, 0.0, 0.76);
    vec2 drift = p - vec2(0.055, 0.16)*t;
    vec2 uv = drift*0.26 + vec2(current.x, swell.z)*0.15;
    // Periodic Gaussian-filtered white noise, ranked to a uniform threshold
    // distribution. Coarse and fine densities gate different-sized clumps.
    float cluster = textureLod(foamThreshold,uv,0.0).r;
    float grain = textureLod(foamThreshold,vec2(-uv.y,uv.x)*4.73 + vec2(0.37,0.81),0.0).r;
    float clusterMask = smoothstep(cluster-0.055, cluster+0.055, saturation);
    float filling = clamp(0.28 + 1.75*(saturation-cluster), 0.0, 0.95);
    float bubbles = mix(smoothstep(grain-0.05,grain+0.05,filling), filling,
        smoothstep(0.009,0.055,footprint));
    float coverage = 0.84*mix(clusterMask*bubbles, saturation*(0.28+0.78*saturation),
        smoothstep(0.055,0.28,footprint));
    return vec3(swell.xy + detail + 0.041*current.yz*dot(bend, detail), coverage);
}

void main(){
    vec2 uv=(gl_FragCoord.xy-.5*viewport)/viewport.y;
    vec3 dir=vec3(uv.x,1.,uv.y-.15);dir/=length(dir);
    vec3 sun=light==0?vec3(-.36,1.,.12):light==1?vec3(.43,.88,.49):vec3(.52,1.,.13);
    sun/=length(sun);
    vec3 color=sky(dir,sun);
    float angle=dir.x/dir.y, height=dir.z/dir.y;
    float ridge=.007+.022*noise(vec2(angle*6.,1.))+.004*noise(vec2(angle*160.,3.));
    float tower=floor(angle*85.);
    float skyline=.006+.045*hash(tower)*exp(-5.*abs(angle-.43));
    float coast=max(ridge,skyline);
    if(height>coast){
        color+=vec3(1.,.77,.45)*(1.-smoothstep(.007,.009,length(dir-sun)));
        // A steel through-truss crossing the western reach.
        float deck=.031+.014*angle;
        float truss=abs(fract((angle+1.)*17.)*2.-1.);
        bool bridge=angle<.12 && (abs(height-deck)<.0018 ||
            (height>deck && (abs(height-deck-.018)<.001 || abs(height-deck-truss*.018)<.0014)) ||
            (height<deck && (abs(fract((angle-.12)*6.))<.035 || angle>.11)));
        if(bridge)color=vec3(.29,.34,.35)*(light==2?.48:1.);
    }else if(height>=0.)color=mix(vec3(.16,.24,.24),vec3(.35,.39,.39),smoothstep(0.,.06,height))*(light==2?.42:1.);
    float travel=2.8/max(-dir.z,.0001);
    vec2 p=dir.xy*travel;
    float footprint=max(length(dFdx(p)),length(dFdy(p)));
    if(height<0.){
        vec3 water=river_surface(p,time,footprint);
        vec2 slope=water.xy;
        vec3 n=vec3(-slope,1.);n/=length(n);
        vec3 r=reflect(dir,n);r.z=abs(r.z);
        float facing=clamp(dot(-dir,n),0.,1.);
        float fresnel=.021+.979*pow(1.-facing,5.);
        vec3 body=vec3(.018,.105,.106)*(light==2?.19:1.)*(1.+.7*slope.y);
        vec3 reflection=sky(r,sun);
        float bank=1.-smoothstep(.0,.11,r.z);
        reflection=mix(reflection,vec3(.16,.23,.24)*(light==2?.3:1.),.40*bank);
        float spec=pow(max(dot(r,sun),0.),340.);
        color=mix(body,reflection,fresnel)+vec3(1.,.71,.42)*spec*(light==2?.12:1.9)*(.14+fresnel);
        vec3 foamLight=light==2?vec3(.15,.19,.28):mix(vec3(.65,.78,.84),vec3(.99,.89,.74),light==0?.64:.24);
        color=mix(color,foamLight,water.z);
        color=mix(color,sky(dir,sun),.70*(1.-exp(-travel*.00095)));
    }
    pixel=vec4(pow(max(color,vec3(0.)),vec3(.4545)),1.);
}
</script><script>
